name: flutter_bloc_todolist
description: A modernized Flutter To-Do List application using Bloc, Clean Architecture, and Material 3.
version: 2.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Data Class / JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  # Utilities
  uuid: ^4.5.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  injectable_generator: ^2.8.1
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true